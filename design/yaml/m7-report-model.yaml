  - name: p1
    label: 任务（必填）
    dataType: String
    required: true
    allowedOperators:
    - EQ
    sourceField: ''
  - name: p2
    label: 步骤序号
    dataType: String
    required: false
    allowedOperators:
    - EQ
    sourceField: ''
  - name: p3
    label: 日志级别（CLC_LOG_LEVEL）
    dataType: String
    required: false
    allowedOperators:
    - EQ
    sourceField: ''
  - name: p4
    label: 游标起点（offset = 已读最大日志序号）
    dataType: Integer
    required: false
    allowedOperators:
    - GTE
    sourceField: ''
