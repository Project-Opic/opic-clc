- id: FUNC-03
  name: 发起安装
  ownerEntity: AGG-CLC-06
  behaviorType: COMMAND
  triggerType: USER_ACTION
  preconditions:
  - "交付版本引用可用（REF-05 禁用版本拦截）"
  - "交付执行机引用就绪"
  - "节点清单非空且校验通过（PENDING 节点不得作为交付目标，INV-15）"
  - "同一集群不存在运行中的交付任务（INV-48 / R-18）"
  - "所选/推导的执行链路在本部署实际可用（远程须已配置 O-IGN 地址、本地须已配置交付工具路径，REF-16 配置侧同源；未配置即拒绝且不落任务行）"
  postconditions:
  - field: ClusterTask.taskStatus
    setValue: "QUEUED（无槽位时排队，REF-14 / R-18）"
  - field: ClusterTask.executionPath
    setValue: "登记值即真实执行位置（INV-32 / REF-16）；未显式选择时由集群 executorRef 推导（非空 = REMOTE_EXECUTOR，O-IGN 侧 Q-71）"
  - field: Cluster.status
    setValue: "INSTALLING"
  - "同事务完成步骤展开：按 CLC_INSTALL_STEP 生成 01~07 七条步骤行（INV-45 / R-17）"
  - field: ClusterTask.stepMode
    setValue: "创建瞬间落定的只读值：向导入口缺省 STEP、其余入口缺省 AUTO（= v1.1 既有连跑，一字不改），页内切换只是创建前的显式覆盖（REF-17 / INV-50）"
