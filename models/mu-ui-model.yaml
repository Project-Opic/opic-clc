model_type: UI
version: '1.3'
domain: 集群域
application:
  name: OPIC-集群域
  menus:
  - menuId: menu-clc-cluster
    name: 集群
    screenRef: frmClcCluster
    note: 唯一工作起点（v1.3，Q-115 / Q-116）；行操作「台」进入集群台宿主屏
  - menuId: menu-clc-template
    name: 集群模板
    screenRef: frmClcTemplate
    note: 跨集群资产，与任何单集群的一生无关，保持一级可见（Q-116）
  - menuId: menu-clc-orch
    name: 交付任务
    screenRef: frmClcOrch
    note: v1.3 由「交付编排」更名（Q-116）；子域 3 的「横看」= 多集群任务台账
  - menuId: menu-clc-ops
    name: 运行观测
    screenRef: frmClcOps
  retiredMenus:
  - menuId: menu-clc-node
    name: 节点管理
    screenRef: frmClcNode
    landedTab: 节点
  - menuId: menu-clc-wizard
    name: 装机向导
    screenRef: frmClcWizard
    landedTab: 安装
  - menuId: menu-clc-ref
    name: 引用与参数
    screenRef: frmClcRef
    landedTab: 配置
  - menuId: menu-clc-snap
    name: 快照与回滚
    screenRef: frmClcSnap
    landedTab: 生命周期
  - menuId: menu-clc-health
    name: 健康探活
    screenRef: frmClcHealth
    landedTab: 生命周期
  menuNote: v1.3 载体置换（Q-116）—— 二级菜单 9 → 一级 4 叶，另有底座审批中心组（menu-workbench，非本域登记）；五叶退出侧栏但其屏幕与元素表一字不动，登记单位由「菜单」变「集群台页签」；深链兼容一版（旧地址重定向进对应页签），库侧 sys_menu 行置不可见而非物理删除
screens:
- screenId: frmClcCluster
  name: 集群列表维护
  screenType: LIST_MAINTENANCE
  layout: ''
  elements:
  - id: el01
    type: SELECT
    label: 生命周期状态
    io: I
    required: false
    dataBinding: Cluster.status
    role: QUERY
  - id: el02
    type: SELECT
    label: 运行模式
    io: I
    required: false
    dataBinding: 同左
    role: QUERY
  - id: el03
    type: SELECT
    label: 健康
    io: I
    required: false
    dataBinding: 同左
    role: QUERY
  - id: el04
    type: BUTTON
    label: 创建集群（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el05
    type: TEXT
    label: 集群编号
    io: O
    required: false
    dataBinding: Cluster / 节点聚合
  - id: el06
    type: TEXT
    label: 名称
    io: O
    required: false
    dataBinding: Cluster / 节点聚合
  - id: el07
    type: TEXT
    label: 节点数
    io: O
    required: false
    dataBinding: Cluster / 节点聚合
  - id: el08
    type: TEXT
    label: 健康（来源 ｜ 时间）
    io: O
    required: false
    dataBinding: 探活 / 事件 / 恢复
  - id: el09
    type: BUTTON
    label: 显式恢复（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el10
    type: BUTTON
    label: 发起升级（按钮）
    io: I
    required: false
    dataBinding: ''
  actions:
  - actionId: act-FUNC-01
    name: 创建集群（四步向导提交）
    actionType: DRAFT
    behaviorRef: FUNC-01
    permissionRef:
    - PERM-FUNC-01
  - actionId: act-FUNC-02
    name: 集群信息修改
    actionType: OTHER
    behaviorRef: FUNC-02
    permissionRef:
    - PERM-FUNC-02
  - actionId: act-FUNC-19
    name: 集群列表查询
    actionType: QUERY
    behaviorRef: FUNC-19
    permissionRef:
    - PERM-FUNC-19
  - actionId: act-FUNC-20
    name: 集群详情查询
    actionType: QUERY
    behaviorRef: FUNC-20
    permissionRef:
    - PERM-FUNC-20
- screenId: frmClcNode
