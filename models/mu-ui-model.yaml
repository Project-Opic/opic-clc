    io: I
    required: false
    dataBinding: ''
  - id: el12
    type: BUTTON
    label: 复制登录标识（行内按钮，v1.2）
    io: I
    required: false
    dataBinding: ''
    sourceNote: 只复制「用户 + 地址」两个字段拼接结果，口令/私钥零出口（REF-18 / 9.8.1 第 ⑤ 条）
  - id: el13
    type: TEXT
    label: 登录标识（行内只读，点按复制时才出）
    io: O
    required: false
    dataBinding: ClusterNode
    role: QUERY
    dataSource: REP-16
    sourceNote: 不随清单一并下发，逐次点按取数（9.9 第 ③ 条）
  - id: el14
    type: SELECT
    label: 呈现档（按角色分组 ｜ 平铺，v1.2）
    io: I
    required: false
    dataBinding: ''
    sourceNote: 只换呈现形态、不改筛选语义与报表计数（5.16 口径 ⑰）；缺省「按角色分组」（9.2.6）
  - id: el15
    type: TEXT
    label: 分组标题（组头台数与异常数，v1.2）
    io: O
    required: false
    dataBinding: ClusterNode
    role: QUERY
    dataSource: REP-03
    sourceNote: 分组轴取 CLC_NODE_ROLE 词条序，组头两数（台数 / 异常数）由已加载行算得；组内行序不随健康事件重排（9.2.6 ③），异常行置顶只在加载时做一次
