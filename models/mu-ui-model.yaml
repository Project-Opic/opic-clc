  - id: el09
    type: BUTTON
    label: 显式恢复（按钮）
    io: I
    required: false
    dataBinding: ''
  - id: el10
    type: BUTTON
    label: 发起升级（按钮）
    io: I
    required: false
    dataBinding: ''
  actions:
  - actionId: act-FUNC-01
    name: 创建集群（四步向导提交）
    actionType: DRAFT
    behaviorRef: FUNC-01
    permissionRef:
    - PERM-FUNC-01
  - actionId: act-FUNC-02
    name: 集群信息修改
    actionType: OTHER
    behaviorRef: FUNC-02
    permissionRef:
    - PERM-FUNC-02
