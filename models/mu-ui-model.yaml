- screenId: frmClcClusterConsole
  name: 集群台
  screenType: MASTER_DETAIL_FORM
  entryNote: v1.3 新增宿主屏（Q-122）—— 无菜单叶，由 frmClcCluster 行操作「台」进入；主 = 一个集群的头部徽章区，从 = 五页签组（落在既有四档形态里，不为新形态改枚举）
  layout: 以「这一个集群的一生」为主体的主从表形态：顶部徽章条（名称 + 编号 + 生命周期状态 / 健康含来源与时间 / 推进模式 / 来源模板只读）是 INV-32「进入即锁链路」在台上的落点，也是 v1.3 起链路事实的唯一权威呈现位（取代各承载屏原屏顶的集群选择器，Q-118）；五页签按「配置｜安装｜生命周期｜节点｜日志」排布，可见性按页签主数据权限码不渲染（DEF-06 口径，Q-119 不为页签发新码），缺省页签按集群状态派生（Q-120 / 9.10.6：DRAFT 无在途 → 安装；RUNNING / DEGRADED → 配置；INSTALL_FAILED / STALLED → 安装并高亮首个未终态步骤）。宿主屏零新增语义：不新增功能点 / 报表 / 权限码 / 字典，页签内容逐条回指既有屏元素表（9.2 / 9.4~9.6 / 9.9），第四条界面纪律「载体置换不复制语义」的落点
  elements:
  - id: el01
    type: TEXT
    label: 集群徽章条（状态 / 健康 / 推进模式 / 来源模板，只读）
    io: O
    required: false
    dataBinding: Cluster
    dataSource: REP-02
    sourceNote: 四组徽章 = 链路事实唯一呈现位（INV-32）；页签内任何状态变更后局部重取本报表，杜绝"页面说运行中、台账是安装失败"的两张皮（9.10.7 第 ① 条）；台内跳转出口与页签切换不重载徽章条
  - id: el02
    type: TAB
    label: 页签组（配置 ｜ 安装 ｜ 生命周期 ｜ 节点 ｜ 日志）
    io: I
    required: false
    dataBinding: ''
    sourceNote: 五档划分按本域语义（参考实现的「安全」页签 = CA 续期，已由 FUNC-46 的 CERT_RENEW 着陆生命周期页签，不另立）；缺位页签不出现在序列里，深链直达无权限页签则不渲染并落回第一个有权页签，接口侧仍由各权限码把门（界面隐藏不是安全边界）
  - id: el03
    type: TEXT
    label: 配置页签主体（集群详情 + 引用与参数 + 交付配置代理）
    io: O
    required: false
    dataBinding: ''
    dataSource: REP-17
    sourceNote: 回指 9.4（frmClcRef 的 FUNC-13~15 / 22 / 23）与 9.9 的配置代理元素，本屏不重复登记元素（FUNC-48 字段级代理、去 O-IGN 改字段跳转）；FUNC-49 原文只读不上移，随 9.9 主体留在「安装」页签（Q-117 / 9.10.1，见 el04）；只读档 ROLE-04 在本页签仅见集群详情与徽章区，引用参数与代理区段不渲染
  - id: el04
    type: TEXT
    label: 安装页签主体（步进器 + 预检 + 两腿日志 + 原文只读）
    io: O
    required: false
