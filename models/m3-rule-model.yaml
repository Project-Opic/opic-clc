- id: R-25
  name: 跨中心只读代理（配置面 / 原文 / 执行日志三条腿）
  ruleType: CROSS_OBJECT
  description: 跨中心只读代理三条腿：本域后端代理读 O-IGN 的集群交付配置（结构化字段视图 FUNC-48 + 原文只读视图 FUNC-49）与交付执行日志（FUNC-51 按 remoteTaskRef + sinceSeq 游标增量取对端逐行原文），不前端直连（跨中心凭据不落浏览器）、用同一门面令牌（不新开一条跨中心通道、不新增服务身份）、各加一张权限码（原文视图与日志视图各自单独发牌、逐次留痕）、不留副本（不在本域缓存配置内容、不落对象、日志行不落 clc_task_log）、不写（覆写 / 校验一律在 O-IGN 侧做，本域只给入口，见 O-IGN FUNC-47 覆写保存 / FUNC-48 dry-run 校验）。日志腿另有两条专属口径：① 与本地链路同档的游标增量、禁整表拉取（INV-43 口径延伸到代理读）；② 对端写前已脱敏（INV-40），本域不二次脱敏、不重算判定、不可达时显式呈现不可达 + 保留跳转兜底，绝不拿旧值冒充现状。本条不扩编号（仍 25 条 R）：v1.3 的日志代理与本条五条口径逐字同族，新增的是落点不是判断 —— 新建一条 R 即是在模型里造第二套判断
