    AUTO，即 v1.1 的既有连跑行为、本批一字不改（「完整保留现有交付编排」的落地口径）；页内「连跑 / 单步」切换是创建前的显式覆盖（会话态，只覆盖本入口缺省），其取值在任务创建瞬间落为任务头只读值、此后不可互转（与
    REF-16 适配器形态、INV-32 执行位置同为「登记即定形」的一族）；STEP 模式下每次只推进一个步骤，AUTO 模式沿用 v1.1 的「展开后由 B-AUTO-10 连续推进」
