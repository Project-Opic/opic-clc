- id: R-24
  name: 跳步与高危动作的事由与后果明示
  ruleType: CROSS_OBJECT
  description: 跳步的事由与后果明示：越过尚未执行的步骤 ⇒ 事由必填（operationReason）+ 该步骤置 SKIPPED 并填跳过原因（INV-38）、后续若失败归因不得写成「执行失败于该步」（如实写明跳过情况）；健康态如实：跳步可能使集群「运行但缺件」，不得为让界面好看而预先置健康（结论仍由
    R-08 双源写入）。同一纪律覆盖生命周期台的高危动作（停止 / 恢复的二次确认 + 事由必填）。判据：与 R-07 强制销毁「强制不免审批」同族 ——
    允许做，但必须把代价留在数据上
