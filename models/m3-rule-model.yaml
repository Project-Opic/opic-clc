- id: R-20
  name: 模板实例化一次性展开、建成后不回写不跟随
  ruleType: CROSS_OBJECT
  description: 模板实例化一次性展开、建成后不回写不跟随：向导在创建事务内把模板的版本引用、节点组（按角色与期望数量生成待登记节点位）与参数默认值展开为集群侧事实，并写一次
    templateRef；模板此后的一切变更（编辑、停用、软删）都不改动已建成的集群、节点与参数（INV-49 的同源联动面）。判据：模板是「输入配方」不是「运行依赖」，跟随会把一次建群动作变成永久耦合，与
    B-AUTO-04 那条「上游变更只置待同步、不自动执行」是同一纪律的更严形态
