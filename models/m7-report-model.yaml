  - conditionId: C01
    leftExpression: 任务
    operator: EQ
    parameterRef: p1
    logicalConnector: AND
    group: BASE
    skipWhenParameterEmpty: false
  - conditionId: C02
    leftExpression: 步骤序号
    operator: EQ
    parameterRef: p2
