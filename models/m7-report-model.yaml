- id: REP-13
  name: 任务日志回放
  alias: rep13
  objectType: LIST_QUERY
  description: 明细（游标增量）。交付形态：游标增量接口（offset = 已读最大日志序号）；运行中任务流式追加、终态任务一次性回放至末尾后停止（绑定 FUNC-35，v1.1 新增）。
