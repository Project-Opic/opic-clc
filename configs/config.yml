# go-techbase 配置(PG16 由 OPIC-数据服务域/Pigsty 供给)
app:
  name: go-techbase
  port: "9680"

log:
  level: info
  output: std
  dir: ./log

# 数据库:PostgreSQL 16(OPIC-DBS 集成 Pigsty 部署;连接串经数据服务域自助申请)
database:
  host: localhost
  port: 5432
  username: postgres
  password: postgres
  dbname: go_techbase
  sslmode: disable
  maxconns: 20
  minconns: 5

# 身份认证:OPIC-零信任安全中心集成的 ZITADEL
# mode=local     本地账号密码登录(开发/单机回退,HS256 会话)
# mode=zitadel   OIDC Authorization Code + PKCE;JWKS 验签;角色声明映射本地角色
auth:
  mode: local
  jwt_secret: go-techbase-dev-secret
  jwt_expires_hours: 12
  allow_local_login: true
  issuer: http://localhost:8080        # ZITADEL 地址(零信任中心 docker-compose)
  client_id: go-techbase
  client_secret: ""
  redirect_url: http://localhost:9680/api/auth/callback
  role_claim: roles                     # ZITADEL 项目角色声明名
  auto_provision: true                  # 按 userinfo 自动建用户
  default_role_codes: SALES             # 自动 provisioning 兜底角色

# 七模型本体 YAML 目录(默认随底座 models/,应用项目可指向自己的 models/)
ontology:
  models_dir: models

# 前端构建产物目录(空则不托管;开发期前端走 vite proxy)
frontend:
  dist_dir: ""

# 事件总线:NATS(O-SYS 事件总线契约的第 3 层实现;v3.3 附录 A.2 #14)
# enabled=false 时为如实降级(Noop);主题命名 opic.<source>.<type>;审计头 X-Trace-Id/X-User-Id 透传
mq:
  enabled: false
  url: "nats://127.0.0.1:4222"
  subject_prefix: opic
  jetstream: false
  timeout_sec: 5

# 持久工作流运行时:Temporal(O-APP 编排结构的域外执行载体;v3.3 附录 A.2 #15)
# enabled=false 时为如实降级;task queue 每中心一个;WorkflowID 与 O-APP WFL 编号族对齐
workflow:
  enabled: false
  host: "localhost:7233"
  namespace: default
  task_queue: opic.platform-base-center
